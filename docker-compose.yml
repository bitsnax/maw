# maw — Managed Agent Wrapper
# Services: traefik (own TLS via step-ca ACME) · migrate · web (Next.js) · postgres:16
#
# Topology: the .201 edge Traefik owns host :80/:443 and SNI-passthroughs
# maw.lan.arpa to THIS stack's traefik over the shared proxy-nw network:
#   edge  tcp/websecure  HostSNI(maw.lan.arpa) passthrough -> traefik-maw:443
#   edge  http/web       ACME challenge                     -> traefik-maw:80
# traefik-maw terminates its own TLS (step-ca ACME) and binds NO host ports.

services:
  traefik:
    image: traefik:v3.6.7
    container_name: traefik-maw
    restart: unless-stopped
    # Resolve *.lan.arpa (ca.lan.arpa for ACME) via the infra dnsmasq.
    dns:
      - 192.168.4.200
    environment:
      # Trust the LAN step-ca root for ACME to https://ca.lan.arpa:9000.
      - LEGO_CA_CERTIFICATES=/etc/traefik/certs/lan-root-ca.crt
    entrypoint:
      - /bin/sh
      - -lc
      - |
        update-ca-certificates >/dev/null 2>&1 || true
        exec traefik --configFile=/etc/traefik/traefik.yml
    expose:
      - "80"
      - "443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/acme:/acme
      - ./traefik/certs/lan-root-ca.crt:/usr/local/share/ca-certificates/lan-root-ca.crt:ro
    networks:
      - maw-net
      - proxy-nw
    depends_on:
      - web

  # One-shot: apply web/prisma/migrations, then exit. web waits for it.
  # Also the place to run one-off scripts, e.g. the first admin:
  #   docker compose run --rm -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=... \
  #     migrate npx tsx scripts/create-admin.ts
  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: migrate
    container_name: maw-migrate
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      # Scripts that prepare a project's workspace (self-tests) write here too.
      - maw-workspaces:/workspaces
    networks:
      - maw-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    container_name: maw-web
    restart: unless-stopped
    dns:
      - 192.168.4.200
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - MAW_OPENCODE_URL=http://maw-opencode:4096
    expose:
      - "3000"
    volumes:
      # Each project's workspace folder (/workspaces/<slug>), shared with maw-opencode.
      - maw-workspaces:/workspaces
    networks:
      - maw-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # OpenCode (Phase 3): the only OpenCode, serving every project from one
  # server (each call names the project's workspace folder). Its read, write,
  # edit, glob, grep and bash are MAW's (opencode/config/tools): they call
  # maw-web's /api/tools with MAW_TOOLS_TOKEN, and MAW runs them on the
  # project's machine. maw-web talks to it with MAW_OPENCODE_PASSWORD.
  # No host port: reached on maw-net only. Sessions live in maw-opencode-data.
  opencode:
    build:
      context: ./opencode
      dockerfile: Dockerfile
    image: maw-opencode:1.19.0
    container_name: maw-opencode
    restart: unless-stopped
    environment:
      - OPENCODE_SERVER_PASSWORD=${MAW_OPENCODE_PASSWORD}
      - MAW_TOOLS_TOKEN=${MAW_TOOLS_TOKEN}
      - MAW_URL=http://maw-web:3000
      - LLAMACPP_API_KEY=${LLAMACPP_API_KEY}
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://192.168.4.201:8081/v1}
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp}
    expose:
      - "4096"
    volumes:
      - maw-opencode-data:/data
      - maw-workspaces:/workspaces
    networks:
      - maw-net

  # The runner (Phase 4): MAW's loop that carries tasks forward one model
  # session at a time (web/scripts/runner.ts, lib/task-runner.ts): task
  # checklist, one session per item, the phases; it stops where you are
  # needed (items for you, phases to approve). All state is in the database,
  # so it is safe to restart; one session at a time across MAW (llama.cpp
  # has one slot). Same image as migrate (lib/ and scripts/).
  runner:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: migrate
    container_name: maw-runner
    restart: unless-stopped
    dns:
      - 192.168.4.200
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - MAW_OPENCODE_URL=http://maw-opencode:4096
    command: ["npx", "tsx", "scripts/runner.ts"]
    volumes:
      # Workspaces (shared with maw-web and maw-opencode); its heartbeat file too.
      - maw-workspaces:/workspaces
    networks:
      - maw-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      opencode:
        condition: service_started

  # maw-agent image, built here and copied to each paired machine
  # (docker save maw-agent:0.2.0 | ssh <machine> docker load). Never started
  # by this stack: the "agent" profile keeps `docker compose up` from running it.
  #   docker compose --profile agent build agent
  agent:
    profiles: ["agent"]
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: maw-agent:0.2.0

  postgres:
    image: postgres:16
    container_name: maw-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Loopback only: lets host-side tools (prisma migrate diff, psql) reach
    # the database without exposing it to the LAN.
    ports:
      - "127.0.0.1:${MAW_DB_HOST_PORT:-5434}:5432"
    volumes:
      - maw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - maw-net

networks:
  maw-net:
    name: maw-net
  # Shared with the edge Traefik so it can reach traefik-maw by name.
  proxy-nw:
    external: true
    name: proxy-nw

volumes:
  maw-pgdata:
    name: maw-pgdata
  maw-opencode-data:
    name: maw-opencode-data
  maw-workspaces:
    name: maw-workspaces
